{% extends 'core/base.html' %}
{% load humanize %}
{% block content %}
<div class="row g-3">
    <div class="col-12 d-flex justify-content-between align-items-center">
        <h5 class="fw-bold mb-0">قائمة الدكاكين والديون</h5>
        <a href="{% url 'add_shop' %}" class="btn btn-success btn-sm"><i class="fas fa-plus"></i> إضافة دكان</a>
    </div>

    <!-- شريط البحث -->
    <div class="col-12">
        <form method="GET" action="">
            <div class="input-group">
                <input type="text" name="q" class="form-control" placeholder="بحث عن دكان..." value="{{ query }}">
                <button class="btn btn-dark" type="submit"><i class="fas fa-search"></i></button>
            </div>
        </form>
    </div>

    <!-- قائمة الدكاكين -->
    <div class="col-12">
        <div class="list-group shadow-sm">
            {% for shop in shops %}
            <a href="{% url 'shop_detail' shop.id %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3">
                <span class="fw-bold text-dark">{{ shop.name }}</span>
                <span class="badge {% if shop.total_balance > 0 %}bg-danger{% else %}bg-secondary{% endif %} rounded-pill fs-6">
                    {{ shop.total_balance|floatformat:0 }} ج.س
                </span>
            </a>
            {% empty %}
            <div class="text-center p-4 text-muted">لا توجد دكاكين مسجلة حالياً.</div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
